<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>5 things I use Claude for</title>
<link rel="stylesheet" href="../../brand/brand.css">
<style>
  .scene { position: absolute; inset: 0; }

  /* Hook */
  .hook-a { position: absolute; left: 80px; top: 600px; width: 900px; }
  .hook-a .line { display: block; font: 900 150px/0.98 var(--sans); letter-spacing: -0.045em; }
  .hook-a .word { display: inline-block; }
  .strike { position: absolute; left: -10px; height: 16px; background: var(--blue); box-shadow: 0 0 24px var(--blue-glow); transform-origin: left center; border-radius: 8px; }
  .hook-b { position: absolute; left: 80px; top: 540px; width: 880px; }
  .hook-b .five { font: 900 330px/0.82 var(--sans); letter-spacing: -0.06em; color: var(--blue); text-shadow: 0 0 60px rgba(56,132,255,0.35); display: inline-block; }
  .hook-b .things { font: 900 118px/1 var(--sans); letter-spacing: -0.04em; display: inline-block; margin-left: 20px; }
  .hook-b .l2 { font: 800 92px/1.02 var(--sans); letter-spacing: -0.035em; margin-top: 26px; }
  .hook-b .rule { height: 3px; background: var(--line); margin: 50px 0 40px; transform-origin: left center; }
  .hook-b .l3 { font: 500 50px/1.2 var(--sans); color: var(--grey); }
  .hook-b .l4 { font: 900 124px/1 var(--sans); letter-spacing: -0.045em; margin-top: 10px; }
  .hook-b .l4 .salary { color: var(--blue); text-shadow: 0 0 40px rgba(56,132,255,0.45); }

  /* Numbered items */
  .item .block { position: absolute; left: 80px; top: 372px; width: 860px; }
  .numeral { position: relative; height: 270px; font: 900 300px/0.9 var(--sans); letter-spacing: -0.06em; }
  .numeral span { position: absolute; left: -8px; top: 0; }
  .numeral .outline { color: transparent; -webkit-text-stroke: 4px var(--blue); }
  .numeral .fill { color: var(--blue); text-shadow: 0 0 50px rgba(56,132,255,0.4); }
  .item h2 { font: 800 88px/1.03 var(--sans); letter-spacing: -0.035em; margin-top: 34px; }
  .item .sub { font: 500 44px/1.25 var(--sans); color: var(--grey); margin-top: 22px; }
  .item .sub b { color: var(--white); font-weight: 600; }
  .card { margin-top: 44px; background: var(--ink); border: 2px solid var(--line); border-radius: 30px; padding: 34px 38px; }
  .card .label { font: 500 26px/1 var(--mono); color: var(--grey); letter-spacing: 0.06em; margin-bottom: 26px; display: flex; justify-content: space-between; }
  .todo { display: flex; align-items: center; gap: 24px; font: 500 38px/1.2 var(--sans); padding: 13px 0; }
  .box { width: 40px; height: 40px; border: 3px solid var(--dim); border-radius: 10px; flex: none; position: relative; }
  .box.done { border-color: var(--blue); background: var(--blue); }
  .box.done::after { content: ""; position: absolute; left: 11px; top: 3px; width: 10px; height: 20px; border: solid #fff; border-width: 0 5px 5px 0; transform: rotate(45deg); }
  .todo.done span { color: var(--grey); text-decoration: line-through; text-decoration-color: var(--blue); text-decoration-thickness: 4px; }
  .bubble { max-width: 700px; padding: 24px 30px; border-radius: 28px; font: 500 36px/1.3 var(--sans); margin: 8px 0; }
  .bubble.me { margin-left: auto; background: var(--blue); color: #fff; border-bottom-right-radius: 8px; }
  .bubble.ai { background: #0E1522; border: 2px solid var(--line); border-bottom-left-radius: 8px; }
  .bubble .who { display: block; font: 600 24px/1 var(--mono); color: var(--blue); margin-bottom: 12px; letter-spacing: 0.04em; }
  .chip { display: inline-flex; align-items: center; gap: 12px; margin-top: 18px; padding: 12px 22px; border-radius: 999px; border: 2px solid var(--blue); color: var(--blue); font: 600 30px/1 var(--mono); }
  pre.code { font: 500 31px/1.45 var(--mono); color: var(--white); white-space: pre; font-variant-ligatures: none; }
  pre.code .k { color: var(--blue); }
  pre.code .c { color: var(--grey); }
  .hl { position: absolute; left: 30px; right: 30px; height: 46px; background: rgba(56,132,255,0.16); border-left: 6px solid var(--blue); border-radius: 6px; }
  .review { margin-top: 24px; border-left: 6px solid var(--blue); background: #0B1220; padding: 22px 26px; border-radius: 0 18px 18px 0; font: 500 32px/1.35 var(--sans); }
  .review b { font: 600 26px/1 var(--mono); color: var(--blue); display: block; margin-bottom: 12px; letter-spacing: 0.04em; }
  .review code { font: 500 28px var(--mono); color: var(--blue); font-variant-ligatures: none; white-space: nowrap; }
  .clock { display: flex; align-items: baseline; gap: 18px; }
  .clock .time { font: 800 150px/1 var(--sans); letter-spacing: -0.04em; }
  .clock .ampm { font: 600 54px/1 var(--mono); color: var(--blue); }
  .notif { margin-top: 26px; background: #0E1522; border: 2px solid var(--line); border-radius: 26px; padding: 26px 30px; }
  .notif .top { font: 600 26px/1 var(--mono); color: var(--grey); display: flex; justify-content: space-between; margin-bottom: 16px; }
  .notif .top .app { color: var(--blue); }
  .notif .msg { font: 600 38px/1.25 var(--sans); }
  .notif .left { font: 500 32px/1.5 var(--sans); color: var(--grey); margin-top: 10px; }
  .step { position: absolute; right: 140px; top: 262px; font: 600 30px/1 var(--mono); letter-spacing: 0.12em; color: var(--grey); }
  .step b { color: var(--white); }

  /* Objection, CTA */
  .center { position: absolute; left: 80px; width: 860px; text-align: left; }
  .obj1 { top: 620px; font: 800 96px/1.04 var(--sans); letter-spacing: -0.035em; }
  .obj2 { top: 900px; font: 900 118px/1.0 var(--sans); letter-spacing: -0.045em; color: var(--blue); text-shadow: 0 0 50px rgba(56,132,255,0.45); }
  .cta-title { top: 470px; font: 900 150px/0.95 var(--sans); letter-spacing: -0.05em; }
  .comment-box { top: 700px; height: 150px; border: 3px solid var(--blue); border-radius: 80px; display: flex; align-items: center; padding: 0 50px; gap: 28px; background: #070C16; box-shadow: 0 0 60px rgba(56,132,255,0.25); }
  .comment-box .avatar { width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6AA4FF, #1F5BD6); flex: none; }
  .comment-box .typed { font: 700 66px/1 var(--mono); letter-spacing: 0.08em; color: var(--white); flex: 1; }
  .comment-box .cursor { display: inline-block; width: 6px; height: 64px; background: var(--blue); vertical-align: -8px; margin-left: 6px; }
  .comment-box .send { font: 700 34px/1 var(--mono); color: var(--blue); }
  .cta-sub { top: 920px; font: 600 64px/1.15 var(--sans); }
  .cta-sub .blue { font-weight: 800; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="reel.js"></script>
</body>
</html>
